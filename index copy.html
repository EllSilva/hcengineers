<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-item Slider Vue 2</title>
    <!-- Vue.js 2 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/vue@2.7.14/dist/vue.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: #121212;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .slider-window {
            position: relative;
            width: 95%;
            max-width: 1200px;
            margin: auto;
            overflow: hidden;
            /* Esconde os slides que saem da área */
        }
        
        .slider-track {
            display: flex;
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            gap: 20px;
            /* Espaço entre os cards */
            padding: 20px 0;
        }
        
        .slide-card {
            /* Cálculo para mostrar 3 itens: (100% / 3) - compensação do gap */
            flex: 0 0 calc(33.333% - 14px);
            height: 400px;
            background-size: cover;
            background-position: center;
            border-radius: 15px;
            display: flex;
            align-items: flex-end;
            position: relative;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .card-info {
            background: linear-gradient(to top, rgba(0, 0, 0, 0.9), transparent);
            width: 100%;
            padding: 20px;
            transform: translateY(0);
            transition: 0.3s;
        }
        
        .slide-card:hover .card-info {
            padding-bottom: 40px;
        }
        /* Controles */
        
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 1);
            color: black;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 10;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }
        
        .prev {
            left: 10px;
        }
        
        .next {
            right: 10px;
        }
        
        .nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        /* Responsividade para Mobile (Mostrar 1 slide) */
        
        @media (max-width: 768px) {
            .slide-card {
                flex: 0 0 100%;
            }
        }
    </style>
</head>

<body>

    <div id="app">
        <div class="slider-window">
            <!-- Botões -->
            <button class="nav-btn prev" @click="prev" :disabled="currentIdx === 0">❮</button>
            <button class="nav-btn next" @click="next" :disabled="currentIdx >= slides.length - 3">❯</button>

            <!-- Trilho dos Slides -->
            <div class="slider-track" :style="{ transform: `translateX(-${currentIdx * (100 / 3 + 0.5)}%)` }">
                <div v-for="slide in slides" :key="slide.id" class="slide-card" :style="{ backgroundImage: 'url(' + slide.img + ')' }">
                    <div class="card-info">
                        <h3>{{ slide.title }}</h3>
                        <p>{{ slide.category }}</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        new Vue({
            el: '#app',
            data: {
                currentIdx: 0,
                slides: [{
                    id: 1,
                    title: 'Projeto Alpha',
                    category: 'Web Design',
                    img: 'https://picsum.photos/id/10/400/600'
                }, {
                    id: 2,
                    title: 'Studio Neon',
                    category: 'Branding',
                    img: 'https://picsum.photos/id/20/400/600'
                }, {
                    id: 3,
                    title: 'Future Tech',
                    category: 'App Dev',
                    img: 'https://picsum.photos/id/30/400/600'
                }, {
                    id: 4,
                    title: 'Minimalist',
                    category: 'Architecture',
                    img: 'https://picsum.photos/id/40/400/600'
                }, {
                    id: 5,
                    title: 'Abstract Art',
                    category: 'Graphic Design',
                    img: 'https://picsum.photos/id/50/400/600'
                }, {
                    id: 6,
                    title: 'Deep Ocean',
                    category: 'Photography',
                    img: 'https://picsum.photos/id/60/400/600'
                }]
            },
            methods: {
                next() {
                    // Impede de avançar além do último grupo de 3
                    if (this.currentIdx < this.slides.length - 3) {
                        this.currentIdx++;
                    }
                },
                prev() {
                    if (this.currentIdx > 0) {
                        this.currentIdx--;
                    }
                }
            }
        });
    </script>

</body>

</html>
