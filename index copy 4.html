<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAQ - Fundação Bradesco (Vue 2)</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <style>
         :root {
            --bradesco-pink: #f52d5e;
        }
        
        body {
            font-family: 'Segoe UI', sans-serif;
            color: #333;
        }
        
        .faq-section {
            padding: 60px 0;
        }
        
        .faq-title {
            font-weight: 700;
            font-size: 2.2rem;
            margin-bottom: 2rem;
        }
        /* Item da FAQ */
        
        .faq-item {
            border-bottom: 1px solid #eee;
        }
        
        .faq-header {
            width: 100%;
            padding: 20px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: none;
            border: none;
            cursor: pointer;
            text-align: left;
            font-size: 1.1rem;
            color: #333;
        }
        
        .faq-header:hover {
            color: var(--bradesco-pink);
        }
        /* Ícone de seta com rotação */
        
        .faq-header i {
            color: var(--bradesco-pink);
            transition: transform 0.3s ease;
        }
        
        .icon-active {
            transform: rotate(90deg);
        }
        /* Resposta com animação */
        
        .faq-answer {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out, padding 0.3s ease;
            color: #666;
            line-height: 1.6;
        }
        
        .is-open {
            max-height: 300px;
            /* Suficiente para o texto */
            padding-bottom: 20px;
        }
        
        .btn-all {
            color: var(--bradesco-pink);
            font-weight: 700;
            text-decoration: none;
            display: inline-block;
            margin-top: 20px;
        }
        /* Card Rosa Lateral */
        
        .cta-card {
            background-color: var(--bradesco-pink);
            border-radius: 8px;
            padding: 4rem 3rem;
            color: white;
            position: relative;
            overflow: hidden;
        }
        
        .cta-card p {
            font-size: 1.6rem;
            margin-bottom: 2rem;
            position: relative;
            z-index: 2;
        }
        
        .btn-cta {
            border: 2px solid white;
            color: white;
            border-radius: 50px;
            padding: 8px 25px;
            text-decoration: none;
            font-weight: 600;
            display: inline-block;
            position: relative;
            z-index: 2;
            transition: 0.3s;
        }
        
        .btn-cta:hover {
            background: white;
            color: var(--bradesco-pink);
        }
        
        .wink-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 7rem;
            font-family: monospace;
            opacity: 0.8;
            pointer-events: none;
        }
    </style>
</head>

<body>

    <div id="app" class="container faq-section">
        <div class="row">
            <div class="col-lg-7">
                <h2 class="faq-title">Perguntas Frequentes</h2>

                <div class="faq-list">
                    <div v-for="(item, index) in faqItems" :key="index" class="faq-item">
                        <button @click="toggle(index)" class="faq-header">
                        <span>{{ item.pergunta }}</span>
                        <i class="bi bi-chevron-right" :class="{ 'icon-active': activeIndex === index }"></i>
                    </button>

                        <div class="faq-answer" :class="{ 'is-open': activeIndex === index }">
                            {{ item.resposta }}
                        </div>
                    </div>
                </div>

                <a href="#" class="btn-all">Mostrar todas as perguntas</a>
            </div>

            <div class="col-lg-5 ps-lg-5">
                <div class="cta-card shadow">
                    <p>Quer iniciar a sua jornada de conhecimento?<br><strong>É grátis!</strong></p>
                    <a href="#" class="btn-cta">Começar agora</a>
                    <span class="wink-icon">;)</span>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>

    <script>
        new Vue({
            el: '#app',
            data: function() {
                return {
                    activeIndex: -1,
                    faqItems: [{
                        pergunta: "Onde está localizado o certificado?",
                        resposta: "Seu certificado fica disponível na seção 'Meus Cursos' no menu lateral, logo após você atingir a nota mínima e concluir o tempo de estudo exigido."
                    }, {
                        pergunta: "Como realizar a matrícula nos cursos?",
                        resposta: "Navegue pelo catálogo de cursos, clique no curso desejado e selecione o botão 'Quero me matricular'. Você terá acesso imediato às aulas."
                    }, {
                        pergunta: "Ao finalizar um curso, recebo um certificado?",
                        resposta: "Sim. A Fundação Bradesco oferece certificados digitais gratuitos para todos os cursos da Escola Virtual, desde que o aluno complete os requisitos de avaliação."
                    }]
                }
            },
            methods: {
                toggle: function(index) {
                    // Se clicar no que já está aberto, fecha tudo (-1), senão abre o novo índice
                    this.activeIndex = this.activeIndex === index ? -1 : index;
                }
            }
        });
    </script>

</body>

</html>
